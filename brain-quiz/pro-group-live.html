return panel('<h3>🏆 لوحة ترتيب المجموعة</h3><p class="muted">النتائج هنا خاصة بغرفتكم فقط، وتتحدث تلقائيًا.</p>'+podium+(ps.length?'<div class="tablewrap"><table><thead><tr><th>#</th><th>الاسم</th><th>الحالة</th><th>الدرجة</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="waiting"><div class="em">👑</div><h3>أول بطل لسه ما ظهرش</h3><p class="muted">شارك الرابط مع صحابك عشان تبدأ المنافسة.</p></div>')+'<p class="sub" style="margin-top:13px">عدد المشاركين: '+ps.length+'</p>','board');
}
function invite(){return panel('<h3>🔗 ابعت دعوة لأصحابك</h3><p class="muted">كل واحد يدخل نفس الرابط باسمه، وتظهر درجته هنا.</p><div class="share"><input class="field" id="inviteurl" readonly dir="ltr" value="'+e(currentLink())+'">'+btn('copy','نسخ','ghost sm')+btn('whatsapp','واتساب','sm')+'</div>');}
function renderRoom(){
if(!state)return '<div class="waiting"><span class="loader"></span><h2>بنفتح الغرفة...</h2>'+btn('refresh','إعادة المحاولة','ghost')+'</div>';
const r=state.room,p=state.player,ps=state.players||[];
let primary='';
if(!p){
 primary=panel('<div class="eyebrow">مستعد تبدأ؟</div><h2>احجز مكانك في التحدي</h2><p class="muted">اكتب اسمك الحقيقي أو لقبك. كل لاعب محاولة واحدة في الجولة.</p><form id="joinform">'+formField('joinname','اسم اللاعب',playerName,'اكتب اسمك',40)+'<label class="check"><input type="checkbox" id="agree" '+(accepted?'checked':'')+'> أوافق على قواعد المسابقة واستبعاد من يغادر صفحة الحل.</label><button class="btn full" type="submit" '+(busy||!accepted||r.status==='closed'||(r.mode==='live'&&r.status!=='waiting')?'disabled':'')+'>انضم للمسابقة ←</button></form>'+(r.status==='closed'?'<p class="muted">التسجيل مغلق.</p>':''));
}else if(p.status==='waiting'){
 if(r.mode==='open')primary=panel('<div class="waiting"><div class="em">🧠</div><div class="eyebrow">تم حجز مكانك</div><h2>جاهز يا '+e(p.name)+'؟</h2><p class="muted">أول ما تضغط ابدأ، عداد الـ٣٠ دقيقة يبدأ من السيرفر.</p><div style="margin-top:23px">'+btn('start','ابدأ التحدي الآن ←','',''+(busy?'disabled':''))+'</div></div>');
 else primary=panel('<div class="waiting"><div class="em">⌛</div><div class="eyebrow">غرفة الانتظار</div><h2>مكانك محجوز يا '+e(p.name)+'</h2><p class="muted">المضيف هيبدأ البطولة لما المجموعة تبقى جاهزة. خليك في الصفحة.</p><div class="statgrid" style="justify-content:center"><div class="stat"><b>'+ps.length+'</b><small>مشارك</small></div></div></div>');
}else if(p.status==='in_progress'&&!(p.questions||[]).length){
 primary=panel('<div class="waiting"><div class="em">🚀</div><h2>الجولة على وشك البداية!</h2><p>الكل داخل مع بعض خلال</p><div class="bigscore" id="startclock">10</div><p class="muted">ما تغيّرش الصفحة لحد ما الأسئلة تفتح.</p></div>');
}else if(p.status==='in_progress')return renderQuiz();
else return renderResult();
return '<div class="roomtop"><div><div class="eyebrow">'+(r.mode==='live'?'⚡ بطولة مباشرة':'👥 غرفة مفتوحة')+'</div><h1 class="roomtitle">'+e(r.title)+'</h1><p class="muted">الجولة '+e(r.round)+' · '+e(statusText[r.status]||r.status)+'</p></div><span class="tag gold">🏆 كأس الشلّة</span></div><div class="roomgrid"><div>'+primary+invite()+'</div><aside>'+panel('<h3>📋 قواعد التحدي</h3>'+ruleBox()+(hostToken?btn('host','إدارة الغرفة ⚙️','full ghost'):'') )+'</aside></div><section class="section">'+board()+'</section>';
}
function renderQuiz(){
const p=state.player,q=(p.questions||[])[qindex],ans=p.answers||[];
if(!q)return '<div class="waiting">بنجهّز السؤال...</div>';
const done=ans.filter(function(a){return a!==null&&a!==undefined;}).length;
let opts=(q.options||[]).map(function(v,i){return '<button class="opt '+(ans[qindex]===i?'selected':'')+'" data-act="answer" data-i="'+i+'" '+(busy?'disabled':'')+'><span class="letter">'+(['أ','ب','ج','د'][i])+'</span><span>'+e(v)+'</span></button>';}).join('');
let qnav=Array.from({length:10},function(_,i){return '<button data-act="jump" data-i="'+i+'" class="'+(i===qindex?'current ':'')+(ans[i]!==null&&ans[i]!==undefined?'answered':'')+'">'+(i+1)+'</button>';}).join('');
return '<div class="quiztitle"><div><div class="eyebrow">'+e(state.room.title)+'</div><h2>شد حيلك يا '+e(p.name)+'!</h2><p class="muted">السؤال '+(qindex+1)+' من ١٠ · كل إجابة صحيحة بـ١٠ درجات</p></div><div class="timer" id="timerbox"><small>الوقت المتبقي</small><b id="timer">30:00</b></div></div><progress class="progress" max="10" value="'+done+'"></progress><p class="muted">تم حفظ '+done+' من ١٠ إجابات</p><div class="jump">'+qnav+'</div><div class="question"><span class="tag gold">'+e(q.category||'تحدي التفكير')+' · ١٠ نقاط</span><h2>'+e(q.prompt)+'</h2>'+(q.svg?'<div class="figure">'+q.svg+'</div>':'')+'<div class="options">'+opts+'</div><div class="quizbuttons">'+btn('prev','→ السابق','ghost',qindex===0||busy?'disabled':'')+(qindex<9?btn('next','التالي ←','',busy?'disabled':''):btn('confirm','تسليم الإجابات 🏁','',busy?'disabled':''))+'</div><div style="margin-top:13px">'+btn('confirm','تسليم الآن','ghost sm',busy?'disabled':'')+'</div></div><div class="alert"><strong>⚠️ ممنوع مغادرة الصفحة أثناء الحل.</strong> الخروج أو تحديث الصفحة أثناء المسابقة يساوي صفرًا.</div>'+(confirmEnd?'<div class="modalback"><div class="modal"><h2>تأكيد تسليم الإجابات؟</h2><p>جاوبت على '+done+' من ١٠ أسئلة. الأسئلة غير المجابة تُحسب خطأ.</p><div class="fline" style="margin-top:20px">'+btn('finish','تأكيد التسليم 🏁','',busy?'disabled':'')+btn('cancel-finish','أكمل الحل','ghost')+'</div></div></div>':'');
}
function renderResult(){
const p=state.player,cheat=p.status==='cheated';
return '<div class="card result"><div class="scoreemoji">'+(cheat?'🚫':(p.score>=80?'🏆':'🎖️'))+'</div><div class="eyebrow">'+e(state.room.title)+'</div><h1>'+(cheat?'تم استبعاد المشاركة':'عاش يا '+e(p.name)+'!')+'</h1><div class="bigscore">'+e(p.score)+'<small>/100</small></div><p class="muted">'+e(p.reason||(cheat?'نتيجة صفر بسبب مغادرة صفحة التحدي.':'النتيجة اتحفظت على السيرفر. شوف ترتيبك مع أصحابك.'))+'</p><p class="sub">النموذج رقم '+String(p.model||0).padStart(2,'0')+' · '+e(p.name)+'</p><div class="fline" style="justify-content:center;margin-top:22px">'+btn('board','شوف المتصدرين 🏆','')+btn('home','غرفة جديدة','ghost')+'</div></div><section class="section">'+invite()+board()+'</section>';
}
function renderHost(){
if(!state)return '<div class="waiting"><span class="loader"></span><h2>جارٍ التحقق من مفتاح إدارة الغرفة</h2>'+btn('refresh','إعادة المحاولة','ghost')+'</div>';
const r=state.room,ps=state.players||[],hps=state.host_players||[];
const actions='<div class="hostcontrols">'+(r.mode==='live'&&r.status==='waiting'?btn('host-start','⚡ ابدأ البطولة','',''+(busy||!ps.length?'disabled':'')):'')+btn('host-close','إغلاق الانضمام','ghost',r.status==='closed'||busy?'disabled':'')+btn('host-reset','جولة جديدة ↻','ghost',ps.some(function(x){return x.status==='in_progress';})||busy?'disabled':'')+btn('export','تصدير النتائج CSV','ghost')+btn('room','صفحة اللاعبين','ghost')+'</div>';
const detail=hps.length?'<div class="tablewrap"><table><thead><tr><th>المشارك</th><th>النموذج</th><th>الدرجة</th><th>الحالة</th></tr></thead><tbody>'+hps.map(function(p){return '<tr><td>'+e(p.name)+'</td><td>'+e(String(p.model).padStart(2,'0'))+'</td><td>'+e(p.score===null?'—':p.score)+'</td><td>'+flag(p.status)+'</td></tr>';}).join('')+'</tbody></table></div>':'<p class="muted">لم ينضم أحد بعد.</p>';
return '<div class="roomtop"><div><div class="eyebrow">🛡️ إدارة المضيف الخاصة</div><h1 class="roomtitle">'+e(r.title)+'</h1><p class="muted">'+(r.mode==='live'?'⚡ بطولة مباشرة':'👥 غرفة مفتوحة')+' · الجولة '+e(r.round)+'</p></div>'+flag(r.status)+'</div>'+invite()+panel('<h2>لوحة قيادة المسابقة</h2><p class="muted">'+(r.mode==='live'?'اجمع أصحابك ثم ابدأ مرة واحدة. بداية موحدة بعد عدّ تنازلي ١٠ ثوانٍ.':'رابط الغرفة مفتوح؛ كل لاعب يبدأ في وقته.')+'</p>'+actions+'<div class="statgrid"><div class="stat"><b>'+ps.length+'</b><small>مشترك</small></div><div class="stat"><b>'+ps.filter(function(x){return x.status==='finished';}).length+'</b><small>سلّم الإجابات</small></div><div class="stat"><b>'+ps.filter(function(x){return x.status==='cheated';}).length+'</b><small>مستبعد</small></div></div>'+detail)+board()+panel('<h3>🔐 احتفظ بمفتاح المضيف</h3><p class="muted">رابط اللاعبين لا يحتوي على مفتاح الإدارة. لو غيرت موبايلك، هتحتاج المفتاح ده للدخول من جديد.</p><div class="share"><input class="field" readonly value="'+e(hostToken)+'" id="hostkey" type="password" dir="ltr">'+btn('copy-host','نسخ المفتاح','ghost sm')+'</div>','section');
}
function hostLogin(){return '<div class="card" style="max-width:550px;margin:auto"><div class="eyebrow">🛡️ صلاحيات المضيف</div><h2>مفتاح إدارة الغرفة</h2><p class="muted">المفتاح يظهر لصاحب الغرفة وقت إنشائها فقط. لا تشاركه مع اللاعبين.</p><form id="hostform">'+formField('hostpass','مفتاح المضيف',hostInput,'الصق المفتاح الذي احتفظت به',64)+'<button class="btn full" type="submit" style="margin-top:17px">دخول الإدارة</button></form>'+btn('room','رجوع لغرفة اللاعبين','ghost sm')+'</div>';}
function render(){if(busy&&document.activeElement&&['INPUT','TEXTAREA'].indexOf(document.activeElement.tagName)>-1)return;
 root.innerHTML=page==='home'?landing():page==='host'?(hostToken&&state?renderHost():hostLogin()):renderRoom();
 updateClock();
}
function updateClock(){if(!state)return;const p=state.player;const el=document.getElementById('timer');if(el&&p&&p.deadline){const sec=Math.max(0,Math.ceil((Date.parse(p.deadline)-Date.now()-clockSkew)/1000));el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec<120)el.parentNode.classList.add('warning');if(sec===0&&!finishSent&&!busy){finishSent=true;action('finish').finally(function(){finishSent=false;});}}const startEl=document.getElementById('startclock');if(startEl&&state.room.starts_at)startEl.textContent=String(Math.max(0,Math.ceil((Date.parse(state.room.starts_at)-Date.now()-clockSkew)/1000)));}
function apply(x){state=x;clockSkew=Date.parse(x.server_now)-Date.now();const p=x.player;const shouldActive=!!(page==='room'&&p&&p.status==='in_progress'&&p.questions&&p.questions.length);if(p&&['finished','cheated'].indexOf(p.status)>-1){active=false;save('active:'+rid,'');save('exit:'+rid,'');}else if(shouldActive){active=true;save('active:'+rid,'1');}else active=false;render();}
async function api(act,token,data,roomOverride,keepalive){const body=JSON.stringify({_action:act,_room:roomOverride===undefined?(rid||null):roomOverride,_token:token||null,_data:data||{}});const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','apikey':PUB},body:body,cache:'no-store',keepalive:!!keepalive});let x;try{x=await res.json();}catch{x={};}if(!res.ok)throw new Error(x.message||x.error||'خطأ في الاتصال بالخادم');return x;}
async function create(){if(busy)return;roomTitle=(document.getElementById('roomtitle')||{}).value||roomTitle;if(roomTitle.trim().length<2){showError('اكتب اسمًا للغرفة');return;}busy=true;try{const x=await api('create',null,{title:roomTitle.trim(),mode:mode},null);rid=x.id;hostToken=x.token;save('host:'+rid,hostToken);page='host';window.__creating=false;state=null;history.replaceState({},'',location.href.split('#')[0]+'#host='+rid);await refresh(true);}catch(ex){showError(ex.message);}finally{busy=false;render();}}
async function join(){if(busy||!accepted)return;playerName=(document.getElementById('joinname')||{}).value||playerName;if(playerName.trim().length<2){showError('اكتب اسمك');return;}busy=true;try{const x=await api('join',null,{name:playerName.trim()});playerToken=x.token;save('player:'+rid,playerToken);apply(x);}catch(ex){showError(ex.message);}finally{busy=false;render();}}
async function action(act,data){if(busy)return;busy=true;try{const token=(act.startsWith('host')?hostToken:playerToken);const x=await api(act,token,data);apply(x);clearMsg();return x;}catch(ex){showError(ex.message);return null;}finally{busy=false;render();}}
async function refresh(force){if(!rid||polling||busy)return;polling=true;try{
 let act,tkn;
 if(page==='host'&&hostToken){act='host';tkn=hostToken;}
 else if(page==='room'&&playerToken){act=state&&state.player&&state.player.status==='in_progress'?'heartbeat':'player';tkn=playerToken;}
 else{act='state';tkn=null;}
 if(page==='room'&&playerToken&&stateStr('exit:'+rid)){act='cheat';tkn=playerToken;}
 const result=await api(act,tkn);
 if(rid===result.room.id){const focused=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('form');if(focused&&state&&page==='room'&&!state.player){state=result;clockSkew=Date.parse(result.server_now)-Date.now();}else apply(result);clearMsg();}
 }catch(ex){if(force||Date.now()-lastPoll>11000)showError(ex.message);}finally{lastPoll=Date.now();polling=false;}}
function detectExit(){if(!active||!playerToken||!rid)return;active=false;save('exit:'+rid,'1');try{const body=JSON.stringify({_action:'cheat',_room:rid,_token:playerToken,_data:{}});fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','apikey':PUB},body:body,keepalive:true,cache:'no-store'}).catch(function(){});}catch{}}
let blurT=0;
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')detectExit();});
window.addEventListener('pagehide',detectExit);
window.addEventListener('blur',function(){clearTimeout(blurT);blurT=setTimeout(function(){if(!document.hasFocus())detectExit();},500);});
window.addEventListener('focus',function(){clearTimeout(blurT);});
window.addEventListener('hashchange',function(){if(active){detectExit();return;}initRoute();});
window.addEventListener('storage',function(ev){if(active&&ev.key==='active:'+rid&&ev.newValue==='other')detectExit();});
document.addEventListener('input',function(ev){const t=ev.target;if(t.id==='roomtitle')roomTitle=t.value;if(t.id==='joinname')playerName=t.value;if(t.id==='hostpass')hostInput=t.value;});
document.addEventListener('change',function(ev){if(ev.target.id==='agree')accepted=!!ev.target.checked;render();});
document.addEventListener('submit',function(ev){ev.preventDefault();if(ev.target.id==='createform')void create();if(ev.target.id==='joinform')void join();if(ev.target.id==='hostform'){hostToken=hostInput.trim();save('host:'+rid,hostToken);void refresh(true);}});
document.addEventListener('click',function(ev){const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;ev.preventDefault();const act=b.dataset.act;
if(act==='home'){if(active){detectExit();showError('تم احتساب مغادرة صفحة المسابقة كاستبعاد');return;}location.hash='';return;}
if(act==='create'){window.__creating=true;render();return;}
if(act==='cancel'){window.__creating=false;render();return;}
if(act==='mode-open'||act==='mode-live'){mode=act==='mode-open'?'open':'live';window.__creating=true;render();return;}
if(act==='select-open'||act==='select-live'){roomTitle=(document.getElementById('roomtitle')||{}).value||roomTitle;mode=act==='select-open'?'open':'live';render();return;}
if(act==='copy'||act==='copy-host'){const value=act==='copy'?currentLink():hostToken;navigator.clipboard.writeText(value).then(function(){toastEl.textContent='✅ تم نسخ الرابط';toastEl.hidden=false;setTimeout(function(){toastEl.hidden=true;},2100);}).catch(function(){showError('حدد النص من حقل الرابط وانسخه يدويًا');});return;}
if(act==='whatsapp'){const text='تقدر تكسب تحدي العباقرة؟ 🧠🏆 انضم لغرفتنا: '+currentLink();window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener');return;}
if(act==='room'){location.hash='room='+rid;return;}
if(act==='host'){location.hash='host='+rid;return;}
if(act==='start'){void action('start');return;}
if(act==='answer'){void action('answer',{index:qindex,option:Number(b.dataset.i)});return;}
if(act==='next'||act==='prev'){qindex=Math.max(0,Math.min(9,qindex+(act==='next'?1:-1)));render();return;}
if(act==='jump'){qindex=Number(b.dataset.i);render();return;}
if(act==='confirm'){confirmEnd=true;render();return;}
if(act==='cancel-finish'){confirmEnd=false;render();return;}
if(act==='finish'){confirmEnd=false;void action('finish');return;}
if(act==='board'){document.querySelector('.board')?.scrollIntoView({behavior:'smooth'});return;}
if(act==='host-start'){if(confirm('بدء البطولة لكل المشتركين بعد ١٠ ثوانٍ؟'))void action('host_start');return;}
if(act==='host-close'){if(confirm('إغلاق الانضمام لهذه الجولة؟'))void action('host_close');return;}
if(act==='host-reset'){if(confirm('هل تريد جولة جديدة؟ لن تُحذف نتائج الجولات السابقة من السيرفر.'))void action('host_reset');return;}
if(act==='export'){if(!state||!state.host_players||!state.host_players.length){showError('لا توجد نتائج للتصدير');return;}const fields=['name','model','score','status','started_at','finished_at','cheat_events'];const lines=[fields.join(',')].concat(state.host_players.map(function(p){return fields.map(function(f){const v=String(p[f]===null||p[f]===undefined?'':p[f]);return '"'+((/^[=+\-@\t\r]/.test(v))?"'":"")+v.replace(/"/g,'""')+'"';}).join(',');}));const url=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='challenge-group-'+rid.slice(0,6)+'.csv';a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);return;}
if(act==='refresh')void refresh(true);
});
function initRoute(){
 const h=location.hash.slice(1),parts=h.split('=');
 const newRoom=/^[a-f0-9-]{36}$/i.test(parts[1]||'')?parts[1]:'';
 if(parts[0]==='room'||parts[0]==='host'){page=parts[0];if(rid!==newRoom){rid=newRoom;state=null;qindex=0;}playerToken=stateStr('player:'+rid);hostToken=stateStr('host:'+rid);if(page==='room'&&playerToken&&stateStr('active:'+rid))save('exit:'+rid,'1');if(page==='room'&&playerToken&&stateStr('exit:'+rid)){api('cheat',playerToken).then(apply).catch(function(){});}void refresh(true);}
 else {page='home';state=null;rid='';active=false;render();}
 render();
}
setInterval(function(){updateClock();},400);
setInterval(function(){if(rid&&document.visibilityState==='visible')void refresh(false);},2900);
initRoute();
})();
</script>
</body>
