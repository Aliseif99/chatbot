/* IQ LEAGUE — premium player identity and achievement card */
.profile-name-trigger{appearance:none;border:0;background:none;color:inherit;font:inherit;font-weight:800;cursor:pointer;padding:6px 2px;border-bottom:1px solid transparent;display:inline-flex;gap:6px;align-items:center;transition:color .18s,border-color .18s}
.profile-name-trigger:hover,.profile-name-trigger:focus-visible{color:var(--gold,#d7b483);border-color:#caac78;outline:none}
.profile-open-icon{font-size:12px;opacity:.6}
.profile-button{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#27374c;border:1px solid #8a7b65;color:#eed5a7;border-radius:12px;padding:10px 16px;font-weight:800;font:inherit;cursor:pointer;transition:all .16s}
.profile-button:hover{background:#34455d;border-color:#d7b483}
.profile-backdrop{position:fixed;z-index:2000;inset:0;background:rgba(3,10,19,.84);backdrop-filter:blur(10px);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:28px 14px}
.profile-panel{width:min(860px,100%);margin:auto;background:linear-gradient(145deg,#19283c 0%,#101b2b 100%);border:1px solid #827052;border-radius:23px;box-shadow:0 35px 110px rgba(0,0,0,.65);color:#edf2fa;overflow:hidden;position:relative}
.profile-panel:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,#8b7859,#e4cd9e,#677c92);pointer-events:none}
.profile-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:23px 28px 0}
.profile-overline{letter-spacing:2px;color:#d6b990;font-size:11px;font-weight:900}
.profile-exit{appearance:none;background:transparent;border:1px solid #4a5b6d;border-radius:10px;color:#d6e0ee;padding:6px 14px;cursor:pointer;font:inherit}
.profile-exit:hover{border-color:#c4a777;color:#fff}
.profile-cover{padding:20px 30px 22px;display:flex;gap:22px;align-items:center}
.profile-avatar{width:105px;height:105px;border-radius:25px;background:linear-gradient(140deg,#baa47a 0%,#6e614b 45%,#233346 100%);padding:4px;box-shadow:0 10px 30px #0005;flex-shrink:0}
.profile-avatar>span{width:100%;height:100%;display:grid;place-items:center;border-radius:21px;background:#1a293d;font-size:46px;color:#f0d6a6;font-weight:900}
.profile-identity{min-width:0;flex:1}
.profile-identity h2{font-size:clamp(25px,4vw,37px);word-break:break-word;margin:7px 0}
.profile-identity p{color:#9eadc2;font-size:14px}
.profile-account-tag{border:1px solid #4f826d;background:#233f38;color:#a4eac7;border-radius:999px;display:inline-flex;padding:4px 11px;font-size:12px;font-weight:800}
.profile-account-tag.guest{border-color:#796b50;background:#362f25;color:#e0c891}
.profile-rule{height:1px;background:#3d5068;margin:0 30px}
.profile-body{padding:27px 30px 32px}
.profile-heading{font-weight:800;font-size:19px;color:#f5f2ed;margin:0 0 17px}
.profile-columns{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:stretch;margin-bottom:24px}
.profile-win-card{border-radius:15px;border:1px solid #566a72;background:linear-gradient(140deg,#1d3b40,#18283d);padding:22px 15px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.profile-ring{width:125px;height:125px;border-radius:50%;background:conic-gradient(#e2c28f calc(var(--p)*1%),#405168 0);display:grid;place-items:center;position:relative;isolation:isolate;margin:0 0 16px}
.profile-ring:before{content:"";position:absolute;inset:12px;background:#1a2c3d;border-radius:50%;z-index:-1}
.profile-ring strong{font-size:31px;color:#f6e0bb}
.profile-win-card small{font-size:12px;color:#acbdd2;text-align:center;line-height:1.5}
.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.profile-stat{background:#1f2e43;border:1px solid #41556c;border-radius:13px;padding:14px;min-width:0}
.profile-stat .value{display:block;font-size:clamp(23px,3vw,31px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2;color:#f4d6a4;direction:ltr;text-align:right}
.profile-stat .name{display:block;font-size:12px;color:#b3c1d5;margin-top:9px}
.profile-medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.profile-medal{display:flex;align-items:center;gap:12px;background:#1d2b40;border:1px solid #3f5167;border-radius:13px;padding:14px 13px}
.profile-medal .medal-symbol{font-size:26px;color:#d8b977}
.profile-medal strong{display:block;font-size:22px;color:#f2e0c2;line-height:1.2}
.profile-medal small{display:block;color:#abbcd2;font-size:11px}

  function invite(){const url=window.location.origin+window.location.pathname+'?room='+encodeURIComponent(roomId);return `<div class="invite"><div class="eyebrow">دعوة المجموعة</div><h3>رابط واحد لجميع المشاركين</h3><p class="muted">أرسل الرابط لأي عدد من أصدقائك؛ كل شخص يدخل باسمه ونتائجه تظهر ضمن هذه الغرفة فقط.</p><div class="invite-row"><input id="share-url" class="input" readonly aria-label="رابط دعوة المجموعة" value="${escape(url)}">${btn('copy-link','نسخ الرابط','secondary sm')}${btn('whatsapp','واتساب','sm')}</div><div class="inviting">لا يتضمن الرابط مفتاح الإدارة، ويمكن فتحه من أي جهاز.</div></div>`;}

  function room(){if(!current)return `<section class="boot"><div class="spinner"></div>جارٍ الاتصال بالغرفة</section>`;

    }else if(p.status==='in_progress' && !(p.questions||[]).length){mainArea=card(`<div class="waiting"><div class="eyebrow">الاستعداد للجولة</div><div class="waiting-symbol">◇</div><h2>استعد للانطلاق</h2><p>سيبدأ الاختبار لجميع المشاركين خلال</p><div class="result-score" id="start-time">10</div><p class="hint">يرجى إبقاء الصفحة مفتوحة.</p></div>`);

  function quiz(){const p=current?.player,total=p?.questions?.length||10,q=p?.questions?.[questionIndex],answered=(p?.answers||[]).filter(v=>v!==null&&v!==undefined).length;if(!q)return '<div class="boot">جارٍ تحميل الأسئلة</div>';

  function result(){const p=current.player,failed=p.status==='cheated',eliminated=p.status==='eliminated';return `<div class="room-page">${card(`<div class="result-ornament">${failed?'×':'◇'}</div><div class="overline">النتيجة النهائية · ${escape(current.room.title)}</div><h1>${failed?'غشاش 👀 — اتقفشت!':eliminated?'خلصت جولتك — استنّى الجولة القادمة!':'اكتملت مشاركتك بنجاح'}</h1><p class="muted">${failed?'ظهر تنبيه المغادرة أثناء الحل، وبالتالي أصبحت درجتك صفرًا حسب قواعد الجولة.':eliminated?'لم تتأهل للجولة القادمة، ولكن تقدر تتابع البطولة وتشجع أصحابك.':escape(p.name)+'، تم تصحيح إجاباتك وتسجيل نتيجتك في المجموعة.'}</p>${failed?'<div class="cheater-note">الاسم على سبيل المزاح بين الأصدقاء، وليس اتهامًا مؤكدًا: أحيانًا تتسبب الإشعارات أو انقطاعات الاتصال في هذا التنبيه.</div>':''}<div class="result-score">${escape(p.score??0)}<small>/100</small></div><p class="muted">النموذج ${String(p.model).padStart(2,'0')} · الجولة ${escape(current.room.round)}</p><div class="btn-row">${btn('show-board','عرض ترتيب المجموعة')}${btn('profile-self','بطاقة إنجازاتي','secondary')}${btn('home','إنشاء تحدٍ جديد','secondary')}</div>`,'result')}<div class="section">${standings()}${invite()}</div></div>`;}

  }
  function authHost(){return `<div class="room-page">${card(`<div class="eyebrow">دخول المنظّم</div><h2>استعادة إدارة الغرفة</h2><p class="muted">لا يمكن إدارة الغرفة باستخدام رابط المشاركين فقط. أدخل مفتاح المنظّم الذي احتفظت به عند الإنشاء.</p><form id="host-form"><label class="form-label" for="host-input">مفتاح المنظّم</label><input id="host-input" type="password" class="input" value="${escape(hostEntry)}" minlength="64" maxlength="64" required placeholder="رمز الأمان الخاص بالغرفة"/><button class="btn block" type="submit" style="margin-top:18px">الدخول إلى الإدارة</button></form><div style="margin-top:15px">${btn('participant','صفحة المشاركين','secondary sm')}</div>`,'auth')}</div>`;}
  function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
  function statePage(){if(screen==='home')return 'home';if(screen==='host')return 'host';if(!current)return 'loading';const p=current.player;if(p?.status==='in_progress'&&(p.questions||[]).length)return 'quiz';if(p&&['finished','cheated','eliminated'].includes(p.status))return 'result';return 'lobby';}

  function statNum(value){const v=Number(value);return Number.isFinite(v)?Math.max(0,v):0;}
  function profileModal(){

    const finished=guest?(localStanding?.status==='finished'?1:0):statNum(d?.finished);
    const naughty=guest?(localStanding?.status==='cheated'?1:0):statNum(d?.excluded);
    const gold=guest?0:statNum(d?.first_place),silver=guest?0:statNum(d?.second_place),bronze=guest?0:statNum(d?.third_place);
    const winrate=guest?0:Math.min(100,statNum(d?.win_rate));

        <div class="profile-grid">
          <div class="profile-stat"><span class="value">${total}</span><span class="name">إجمالي المشاركات</span></div>

          <div class="profile-stat"><span class="value">${naughty}</span><span class="name">مرات «غشاش 👀»</span></div>
          <div class="profile-stat"><span class="value">${guest?'—':statNum(d?.competitive_rounds)}</span><span class="name">بطولات تنافسية</span></div>
          <div class="profile-stat"><span class="value">${guest&& !finished?'—':average}</span><span class="name">متوسط الدرجات</span></div>

  async function showProfile(name,accountId=''){
    if(activeQuiz){notify('ملف الإنجازات متاح بعد إنهاء الاختبار حتى لا تتشتت.');return;}
    profileUI={open:true,name:String(name||'لاعب'),accountId:String(accountId||''),loading:!!accountId,data:null,error:''};
    render();
    if(!accountId)return;
    const viewing=profileUI;
    if(!playerToken&&!hostToken){viewing.loading=false;viewing.error='يجب أن تكون مشاركًا في الغرفة لعرض سجل اللاعب.';render();return;}
    try{
      const u=API.replace(/\/challenge_portal$/, '/challenge_account_action');
      const res=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({_action:'profile',_room:roomId,_player_token:playerToken||hostToken,_target:accountId}),cache:'no-store'});
      const d=await res.json();
      if(!res.ok)throw Error(d.message||d.error||'تعذر تحميل سجل اللاعب');
      viewing.data=d;
    }catch(ex){viewing.error=ex.message||'تعذر تحميل سجل اللاعب';}
    finally{viewing.loading=false;if(profileUI===viewing)render();}
  }

  function render(){const prior=document.activeElement;const keepForm=prior?.tagName==='INPUT'&&prior.closest('form')&& screen!=='quiz'; if(keepForm && !busy)return;const target=statePage(); main.innerHTML=target==='home'?home():target==='host'?(hostToken?host():authHost()):target==='quiz'?quiz():target==='result'?result():room(); lastServerStatus=target;if(profileUI.open)main.insertAdjacentHTML('beforeend',profileModal());updateClock();}
  function updateClock(){const p=current?.player;if(p?.status==='in_progress'&&p.deadline){const seconds=Math.max(0,Math.ceil((Date.parse(p.deadline)-Date.now()-offset)/1000)); const el=document.getElementById('time-left');if(el){el.textContent=formatTime(seconds);if(seconds<120)document.getElementById('timer-box')?.classList.add('warning');}if(seconds===0&&!ended&&!busy){ended=true;void act('finish').finally(()=>ended=false);}}
   const pre=document.getElementById('start-time');if(pre&&current?.room?.starts_at){pre.textContent=Math.max(0,Math.ceil((Date.parse(current.room.starts_at)-Date.now()-offset)/1000));}
  }
  function updateGuard(){const p=current?.player;const should=screen==='room'&&p?.status==='in_progress'&&(p.questions||[]).length>0;
    if(should&&!activeQuiz){activeQuiz=true;write('active:'+roomId,'1');if(typeof BroadcastChannel!=='undefined'){try{channel=new BroadcastChannel('iq-competition:'+roomId);channel.onmessage=event=>{if(event.data?.type==='active'&&event.data?.token===playerToken)detectedExit();};channel.postMessage({type:'active',token:playerToken});}catch{}}}
    if(!should&&activeQuiz){activeQuiz=false;channel?.close();channel=null;}
    if(p&&['finished','cheated','eliminated'].includes(p.status)){write('active:'+roomId,'');write('left:'+roomId,'');}
  }
  function adopt(result){if(!result?.room)return;const old=statePage();current=result; offset=Date.parse(result.server_now)-Date.now();updateGuard();const next=statePage();if(old==='quiz'&&next==='quiz'){updateClock();return;}render();}
  async function api(action, token, data={}){const sending=Date.now();const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({_action:action,_room:roomId||null,_token:token||null,_data:data}),cache:'no-store'});let result;try{result=await res.json();}catch{throw Error('استجابة غير صالحة من خادم النتائج.');}if(!res.ok){throw Error(result.message||result.error||'تعذر الوصول إلى خادم المسابقة.');}if(result?.server_now){offset=Date.parse(result.server_now)-(sending+Date.now())/2;}return result;}
  async function act(action,data={}){if(busy)return null;busy=true;try{const auth=action.startsWith('host_')?hostToken:playerToken;const result=await api(action,auth,data);if(action==='join'&&result.token){playerToken=result.token;write('player:'+roomId,playerToken);}adopt(result);return result;}catch(err){notify(err.message||'تعذر تنفيذ الطلب');return null;}finally{busy=false;render();}}
  async function create(){if(busy)return;busy=true;try{const title=newRoomName.trim();if(title.length<2||title.length>60)throw Error('يرجى كتابة اسم صحيح للمسابقة');if(!subjects.length)throw Error('اختار مجالًا واحدًا على الأقل');if(!Number.isInteger(questionCount)||questionCount<10||questionCount>25)throw Error('اختار من 10 إلى 25 سؤالًا');if(questionCount!==10)throw Error('الحد الحالي 10 أسئلة بسبب قيد الخادم؛ سيتم رفعه بعد اختبار قاعدة البيانات.');if(!Number.isInteger(durationMinutes)||durationMinutes<1||durationMinutes>45)throw Error('اختار وقتًا من 1 إلى 45 دقيقة');const result=await api('create',null,{title,mode,subjects,question_count:questionCount,duration_minutes:durationMinutes});if(!result.id||!result.token)throw Error('لم تصل بيانات الغرفة من الخادم');roomId=result.id;hostToken=result.token;playerToken='';write('host:'+roomId,hostToken);current=null;createOpen=false;history.pushState({},'',location.pathname+'?room='+roomId+'&host=1');screen='host';await refresh(true);notify('تم إنشاء الغرفة بنجاح. أرسل رابط الدعوة إلى مجموعتك.',true);}catch(err){notify(err.message||'تعذر إنشاء الغرفة');}finally{busy=false;render();}}
  async function refresh(forced=false){if(fetching||(busy&&!forced)||!roomId)return;fetching=true;try{let action,token;if(screen==='host'&&hostToken){action='host';token=hostToken;}else if(screen==='room'&&playerToken){action=read('left:'+roomId)?'cheat':current?.player?.status==='in_progress'?'heartbeat':'player';token=playerToken;}else{action='state';token=null;}
    const result=await api(action,token);lastHeartbeat=Date.now();const old=statePage();adopt(result);if(!forced&&old==='quiz'&&statePage()==='quiz')updateClock();
  }catch(err){if(forced||Date.now()-lastHeartbeat>14000)notify('تعذر تحديث النتائج: '+(err.message||'خطأ غير معروف'));if(/المشاركة غير موجودة|انتهت الجولة/.test(err.message||'')){write('player:'+roomId,'');write('left:'+roomId,'');write('active:'+roomId,'');playerToken='';current=null;}}
    finally{fetching=false;}}
  function detectedExit(){if(!activeQuiz||!playerToken||!roomId)return;activeQuiz=false;write('left:'+roomId,'1');const body=JSON.stringify({_action:'cheat',_room:roomId,_token:playerToken,_data:{}});try{fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body,keepalive:true,cache:'no-store'}).catch(()=>{});}catch{}}
  function route(){const params=new URL(location.href).searchParams;const candidate=params.get('room')||'';const valid=/^[a-f\d]{8}-[a-f\d]{4}-[a-f\d]{4}-[a-f\d]{4}-[a-f\d]{12}$/i.test(candidate);
    if(!valid){screen='home';roomId='';current=null;hostToken='';playerToken='';activeQuiz=false;render();return;}
    if(activeQuiz && candidate!==roomId)detectedExit();
    if(candidate!==roomId){roomId=candidate;current=null;questionIndex=0;finalConfirm=false;}
    playerToken=read('player:'+roomId);hostToken=read('host:'+roomId);const enteringHost=params.has('host');screen=enteringHost?'host':'room';if(!enteringHost&&playerToken&&read('active:'+roomId))write('left:'+roomId,'1');
    render();void refresh(true);
  }
  const go=url=>{if(activeQuiz)detectedExit();history.pushState({},'',url);route();};
  async function copy(value){try{await navigator.clipboard.writeText(value);notify('تم نسخ الرابط إلى الحافظة',true);}catch{notify('تعذر النسخ التلقائي. يمكنك تحديد النص ونسخه يدويًا.');}}
  const shareUrl=()=>location.origin+location.pathname+'?room='+encodeURIComponent(roomId);
  function csv(){const ps=current?.host_players||[];if(!ps.length)return notify('لا توجد نتائج للتصدير');const fields=['name','model','score','status','started_at','finished_at','cheat_events'];const clean=value=>{const s=String(value??'');return '"'+(/^[=+\-@\t\r]/.test(s)?"'":'')+s.replace(/"/g,'""')+'"';};const lines=[fields.join(','),...ps.map(p=>fields.map(f=>clean(p[f])).join(','))].join('\r\n');const blob=new Blob(['\uFEFF'+lines],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`iq-league-${roomId.slice(0,8)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);}
  main.addEventListener('click',async event=>{const control=event.target.closest('[data-action]');if(!control||control.disabled)return;event.preventDefault();const a=control.dataset.action;
    if(a==='profile-close'||a==='profile-close-backdrop'){if(a==='profile-close'||event.target===control){profileUI.open=false;render();}return;}
    if(a==='profile-self'){const p=current?.player;if(p){const entry=(current?.players||[]).find(x=>x.name===p.name);await showProfile(p.name,entry?.account_id||'');}return;}
    if(a==='profile-player'){await showProfile(control.dataset.name||'',control.dataset.account||'');return;}
    if(['create','open-mode','live-mode','math-category','geo-category','mixed-category'].includes(a)){createOpen=true;if(a==='open-mode')mode='open';if(a==='live-mode')mode='live';if(a==='math-category')subjects=['math'];if(a==='geo-category')subjects=['geo'];if(a==='mixed-category')subjects=['math','geo'];render();return;}
    if(a==='close-modal'){createOpen=false;render();return;}
    if(['select-open','select-live','select-knockout'].includes(a)){mode=a==='select-open'?'open':a==='select-live'?'live':'knockout';render();return;}
    if(a==='scroll-modes'){document.getElementById('modes')?.scrollIntoView({behavior:'smooth'});return;}
    if(a==='home'){go(location.pathname);return;}
    if(a==='participant'){go(location.pathname+'?room='+roomId);return;}
    if(a==='copy-link'){await copy(shareUrl());return;}
    if(a==='copy-host'){await copy(hostToken);return;}
    if(a==='whatsapp'){window.open('https://wa.me/?text='+encodeURIComponent('دعوة للمشاركة في تحدي العباقرة: '+shareUrl()),'_blank','noopener,noreferrer');return;}
    if(a==='start'){await act('start');return;}
    if(a==='answer'){const option=Number(control.dataset.index);await act('answer',{index:questionIndex,option});return;}
    if(a==='prev'||a==='next'){questionIndex=Math.max(0,Math.min((current?.player?.questions?.length||10)-1,questionIndex+(a==='next'?1:-1)));render();return;}
    if(a==='jump'){questionIndex=Number(control.dataset.index);render();return;}
    if(a==='confirm-finish'){finalConfirm=true;render();return;}
    if(a==='cancel-finish'){finalConfirm=false;render();return;}
    if(a==='finish'){finalConfirm=false;await act('finish');return;}
    if(a==='show-board'){document.querySelector('.board')?.scrollIntoView({behavior:'smooth'});return;}
    if(a==='host-start'&&confirm('سيبدأ العد التنازلي 10 ثوانٍ لكل المشاركين. بدء البطولة الآن؟')){await act('host_start');return;}
    if(a==='host-close'&&confirm('إغلاق التسجيل للغرفة؟')){await act('host_close');return;}
    if(a==='host-advance'&&confirm('تأكيد انتهاء الجولة وتأهيل الناجين؟')){await act('host_advance');return;}
    if(a==='host-reset'&&confirm('فتح جولة جديدة بنفس رابط الدعوة؟')){await act('host_reset');return;}
    if(a==='download'){csv();return;}
  });
  main.addEventListener('input',ev=>{const t=ev.target;if(t.id==='new-title')newRoomName=t.value;if(t.id==='player-name')joinName=t.value;if(t.id==='host-input')hostEntry=t.value;if(t.id==='builder-questions')questionCount=Number(t.value);if(t.id==='builder-time')durationMinutes=Number(t.value);});
  main.addEventListener('change',ev=>{if(ev.target.id==='subject-math'||ev.target.id==='subject-geo'){const value=ev.target.id==='subject-math'?'math':'geo';if(ev.target.checked&&!subjects.includes(value))subjects.push(value);if(!ev.target.checked)subjects=subjects.filter(x=>x!==value);}
    if(ev.target.id==='agree-rules'){accepted=ev.target.checked;const b=main.querySelector('#join-form button[type=submit]');if(b)b.disabled=!accepted;}});
  main.addEventListener('submit',async ev=>{ev.preventDefault();if(ev.target.id==='create-form')await create();if(ev.target.id==='join-form'){if(!accepted)return notify('يجب قبول قواعد التحدي أولًا.');joinName=main.querySelector('#player-name')?.value.trim()||'';if(joinName.length<2||joinName.length>40)return notify('اختر اسمًا من حرفين إلى أربعين حرفًا.');await act('join',{name:joinName});}if(ev.target.id==='host-form'){hostEntry=main.querySelector('#host-input')?.value.trim()||'';if(hostEntry.length!==64)return notify('مفتاح الإدارة غير صالح.');hostToken=hostEntry;write('host:'+roomId,hostToken);await refresh(true);}});
  document.querySelector('#brand-home').addEventListener('click',ev=>{ev.preventDefault();go(location.pathname);});
  document.querySelector('#nav-home').addEventListener('click',()=>go(location.pathname));
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&profileUI.open){profileUI.open=false;render();}});
  window.addEventListener('popstate',()=>{if(activeQuiz)detectedExit();route();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')detectedExit();});
  window.addEventListener('pagehide',detectedExit);
  window.addEventListener('blur',()=>{clearTimeout(blurTimer);blurTimer=setTimeout(()=>{if(document.visibilityState==='hidden'||!document.hasFocus())detectedExit();},1200);});
  window.addEventListener('focus',()=>clearTimeout(blurTimer));
  timerId=setInterval(updateClock,400);
  pollTimer=setInterval(()=>{if(roomId&&document.visibilityState==='visible')void refresh();},7800);
  route();
})();

</script>
</body>
