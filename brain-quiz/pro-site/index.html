  }
  function home() {
    return `<div class="hero"><div class="hero-copy"><div class="eyebrow">منصة مسابقات ذهنية جماعية</div><h1>المنافسة تبدأ<span>بفكرة واحدة.</span></h1><p>تحدٍ فكري يجمع الأصدقاء والزملاء في تجربة جادة وممتعة. أسئلة متنوعة، وقت محدد، نتائج موثّقة وترتيب مشترك لكل مجموعة.</p><div class="hero-actions">${btn('create','إنشاء منافسة جديدة <span aria-hidden="true">←</span>')}${btn('scroll-modes','استكشف أنظمة اللعب','secondary')}</div><div class="hero-caption"><span>20 نموذج اختبار</span><span>10 أسئلة متنوعة</span><span>لوحة ترتيب مستقلة</span></div></div>${heroGraphic()}</div><section class="section" id="modes"><div class="section-title"><div><div class="eyebrow">أنظمة المشاركة</div><h2>تنافس بالطريقة التي تناسب مجموعتك.</h2></div><p>نفس معايير التصحيح لجميع المشاركين</p></div><div class="modes"><article class="mode-card"><div class="mode-num"><span>01 / OPEN CHALLENGE</span><span class="mode-icon">${icons.users}</span></div><h3>تحدٍ مفتوح</h3><p>تشارك المجموعة رابطًا واحدًا، ويبدأ كل متسابق محاولته في الوقت المناسب له. تُجمع الدرجات تلقائيًا في لوحة ترتيب موحّدة.</p><div class="chips"><span>بداية مستقلة</span><span>رابط ثابت</span><span>نتائج مستمرة</span></div>${btn('open-mode','إنشاء تحدٍ مفتوح ←','secondary block')}</article><article class="mode-card"><div class="mode-num"><span>02 / LIVE CHAMPIONSHIP</span><span class="mode-icon">${icons.time}</span></div><h3>بطولة مباشرة</h3><p>يدخل المشاركون غرفة انتظار، ثم يطلق المنظّم المنافسة في موعد واحد. يبدأ الجميع مع عدّ تنازلي متزامن وتُعرض النتائج فور انتهاء كل محاولة.</p><div class="chips"><span>غرفة انتظار</span><span>بداية موحدة</span><span>تحكم للمنظّم</span></div>${btn('live-mode','إنشاء بطولة مباشرة ←','block')}</article></div></section><section class="section">${card(`<div class="eyebrow">الضوابط ومعايير التقييم</div><h2>قواعد واحدة لمنافسة عادلة.</h2>${rules()}<p class="hint">يُوزّع أحد النماذج العشرين على كل مشارك. التصحيح وحفظ الدرجات يتمان على الخادم، وليس على جهاز اللاعب.</p>`,'rule-panel')}</section>${createOpen ? createModal() : ''}`;
  }
  function createModal(){return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="eyebrow">تكوين منافسة جديدة</div><h2 id="modal-title">إعداد الغرفة</h2><form id="create-form"><label class="form-label" for="new-title">اسم المنافسة</label><input id="new-title" class="input" name="title" minlength="2" maxlength="60" required autocomplete="off" placeholder="مثال: مسابقة فريق العمل" value="${escape(newRoomName)}"><label class="form-label">نظام المشاركة</label><div class="mode-choice">${btn('select-open','تحدٍ مفتوح', mode==='open' ? '' : 'secondary')}${btn('select-live','بطولة مباشرة',mode==='live' ? '' : 'secondary')}</div><p class="hint">ستحصل على رابط للمتسابقين ومفتاح منفصل لإدارة الغرفة.</p><div class="actions"><button type="submit" class="btn" ${busy?'disabled':''}>إنشاء الغرفة ←</button>${btn('close-modal','إلغاء','secondary')}</div></form></section></div>`;}
  function status(v){return `<span class="state-pill ${escape(v)}">${escape(statusLabels[v]||v)}</span>`;}
  function standings(){const players = current?.players || []; const winners=players.filter(x=>x.status==='finished').slice(0,3);
    let podium=''; if(winners.length){podium='<div class="podium">'+[1,0,2].map(i=>winners[i]?`<div class="podium-item ${i===0?'first':''}"><span class="podium-medal">${['I','II','III'][i]}</span><span class="podium-name">${escape(winners[i].name)}</span><span class="podium-points">${winners[i].score}<small>/100</small></span></div>`:'<div></div>').join('')+'</div>';}
    const rows=players.map(p=>`<tr><td><span class="rank-no">${escape(p.rank)}</span></td><td>${escape(p.name)}${current?.player?.name===p.name?' <small class="muted">(أنت)</small>':''}</td><td>${status(p.status)}</td><td><span class="score">${p.score===null?'—':escape(p.score)}</span></td></tr>`).join('');
    return card(`<div class="panel-head"><div><div class="eyebrow">نتائج هذه الغرفة فقط</div><h3>لوحة المتصدرين</h3></div><span class="muted">${players.length} مشارك</span></div>${podium}${players.length?`<div class="table-wrap"><table><thead><tr><th>الترتيب</th><th>المشارك</th><th>الحالة</th><th>النقاط</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty"><svg viewBox="0 0 48 48" fill="none" stroke-width="1.5"><path d="M8 42h32M13 37h22V16H13zM24 16V7M19 7h10M6 16H2v6c0 6 6 9 11 9M42 16h4v6c0 6-6 9-11 9"/></svg>بانتظار أول مشاركة. شارك رابط الدعوة مع المجموعة.</div>'}`,'board');
  }
  function invite(){const url=window.location.origin+window.location.pathname+'?room='+encodeURIComponent(roomId);return `<div class="invite"><div class="eyebrow">دعوة المجموعة</div><h3>رابط واحد لجميع المشاركين</h3><p class="muted">أرسل الرابط لأي عدد من أصدقائك؛ كل شخص يدخل باسمه ونتائجه تظهر ضمن هذه الغرفة فقط.</p><div class="invite-row"><input id="share-url" class="input" readonly aria-label="رابط دعوة المجموعة" value="${escape(url)}">${btn('copy-link','نسخ الرابط','secondary sm')}${btn('whatsapp','واتساب','sm')}</div><div class="inviting">لا يتضمن الرابط مفتاح الإدارة، ويمكن فتحه من أي جهاز.</div></div>`;}
  function roomHeader(){const room=current?.room;if(!room)return '';return `<div class="room-top"><div class="panel-head"><div><div class="eyebrow">${room.mode==='live'?'LIVE CHAMPIONSHIP':'OPEN CHALLENGE'} / الجولة ${escape(room.round)}</div><h1>${escape(room.title)}</h1><p class="subtitle">${room.mode==='live'?'بطولة بوقت انطلاق موحّد لجميع المسجلين':'ابدأ في الوقت المناسب لك، وشارك نفس ترتيب مجموعتك'}</p></div><span class="mode-status">${room.mode==='live'?'بطولة مباشرة':'تحدٍ مفتوح'} · ${escape(statusLabels[room.status]||room.status)}</span></div></div>`;}
  function room(){if(!current)return `<section class="boot"><div class="spinner"></div>جارٍ الاتصال بالغرفة</section>`;
    const r=current.room, p=current.player;
    let mainArea='';
    if(!p){const disabled=r.status==='closed'||(r.mode==='live'&&r.status!=='waiting');mainArea=card(`<div class="eyebrow">التسجيل في المنافسة</div><h2>سجّل مشاركتك</h2><p class="muted">اختر اسمًا ظاهرًا لباقي المشاركين في لوحة النتائج.</p><form id="join-form"><label class="form-label" for="player-name">اسم المشارك</label><input id="player-name" class="input" name="name" minlength="2" maxlength="40" autocomplete="name" required placeholder="الاسم الكامل أو اسم الشهرة" value="${escape(joinName)}"><label class="agree"><input id="agree-rules" type="checkbox" ${accepted?'checked':''}>أوافق على ضوابط المسابقة وسياسة الاستبعاد عند مغادرة صفحة الحل.</label><button type="submit" class="btn block" ${disabled||!accepted||busy?'disabled':''}>الانضمام إلى المنافسة ←</button>${disabled?'<p class="hint">التسجيل مغلق حاليًا؛ تابع النتائج أو انتظر الجولة القادمة.</p>':''}</form>`);
    }else if(p.status==='waiting'){mainArea=card(`<div class="waiting"><div class="eyebrow">تم تأكيد مشاركتك</div><div class="waiting-symbol">◇</div><h2>${escape(p.name)}</h2><p>${r.mode==='live'?'المنافسة في انتظار إشارة بدء المنظّم. ستظهر الأسئلة تلقائيًا للجميع عند إطلاق الجولة.':'يمكنك بدء اختبارك الآن. يبدأ الوقت عند الضغط على زر البداية.'}</p>${r.mode==='open'?btn('start','بدء الاختبار — 30 دقيقة ←','',busy):'<span class="mode-status">في انتظار بدء البطولة</span>'}</div>`);
    }else if(p.status==='in_progress' && !(p.questions||[]).length){mainArea=card(`<div class="waiting"><div class="eyebrow">الاستعداد للجولة</div><div class="waiting-symbol">◇</div><h2>استعد للانطلاق</h2><p>سيبدأ الاختبار لجميع المشاركين خلال</p><div class="result-score" id="start-time">10</div><p class="hint">يرجى إبقاء الصفحة مفتوحة.</p></div>`);
    }else if(p.status==='in_progress')return quiz();else return result();
    const players=current.players||[];
    return `<div class="room-page">${roomHeader()}<div class="grid"><div>${mainArea}${invite()}</div><aside>${card(`<div class="eyebrow">معلومات الجولة</div><h3>قواعد ومدة الاختبار</h3>${rules()}<div class="stats"><div class="stat"><b>${players.length}</b><small>مشارك</small></div><div class="stat"><b>${players.filter(p=>p.status==='finished').length}</b><small>أكمل</small></div><div class="stat"><b>${players.filter(p=>p.status==='in_progress').length}</b><small>يؤدي الاختبار</small></div></div>`)}</aside></div><div class="section">${standings()}</div></div>`;
  }
  function quiz(){const p=current?.player,q=p?.questions?.[questionIndex],answered=(p?.answers||[]).filter(v=>v!==null&&v!==undefined).length;if(!q)return '<div class="boot">جارٍ تحميل الأسئلة</div>';
    const options=q.options.map((v,i)=>`<button type="button" class="option ${p.answers[questionIndex]===i?'selected':''}" data-action="answer" data-index="${i}" ${busy?'disabled':''}><span>${['أ','ب','ج','د'][i]}</span>${escape(v)}</button>`).join('');
    const jumps=Array.from({length:10},(_,i)=>`<button class="q-jump ${i===questionIndex?'active':''} ${p.answers[i]!==null&&p.answers[i]!==undefined?'answered':''}" data-action="jump" data-index="${i}" aria-label="السؤال ${i+1}">${i+1}</button>`).join('');
    const now=Math.max(0,Math.ceil((Date.parse(p.deadline)-Date.now()-offset)/1000));
    return `<div class="quiz-wrap"><div class="quiz-top"><div><div class="eyebrow">${escape(current.room.title)}</div><h2>اختبار ${escape(p.name)}</h2><p class="muted">النموذج الذهني · سؤال ${questionIndex+1} من 10</p></div><div class="quiz-timer" id="timer-box"><small>الوقت المتبقي</small><b id="time-left" dir="ltr">${formatTime(now)}</b></div></div><div class="quiz-progress"><span>التقدم: ${answered} / 10</span><span>10 نقاط لكل سؤال</span></div><progress class="progress" max="10" value="${answered}"></progress><div class="question-map">${jumps}</div>${card(`<div class="eyebrow">${escape(q.category || 'استدلال ذهني')}</div><h2>${escape(q.prompt)}</h2>${q.svg?`<div class="diagram">${q.svg}</div>`:''}<div class="options">${options}</div><div class="question-actions">${btn('prev','السابق →','secondary',questionIndex===0||busy)}${questionIndex<9?btn('next','التالي ←','',busy):btn('confirm-finish','تسليم الإجابات','',busy)}</div><div style="margin-top:12px">${btn('confirm-finish','إنهاء وتسليم الآن','text sm',busy)}</div>`,'question-card')}<div class="notice">تُحسب الإجابات غير المُجاب عنها خطأً. بعد التسليم لا يُسمح بتعديل النتيجة. مغادرة هذه الصفحة أثناء الاختبار تؤدي للاستبعاد.</div>${finalConfirm?`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="eyebrow">التسليم النهائي</div><h2>تأكيد إنهاء الاختبار</h2><p>أجبت عن ${answered} من أصل 10 أسئلة. هل ترغب في اعتماد إجاباتك الآن؟</p><div class="actions">${btn('finish','تأكيد التسليم')}${btn('cancel-finish','متابعة الإجابة','secondary')}</div></section></div>`:''}</div>`;
  }
  function result(){const p=current.player,failed=p.status==='cheated';return `<div class="room-page">${card(`<div class="result-ornament">${failed?'×':'◇'}</div><div class="overline">النتيجة النهائية · ${escape(current.room.title)}</div><h1>${failed?'تم استبعاد المحاولة':'اكتملت مشاركتك بنجاح'}</h1><p class="muted">${failed?escape(p.reason||'مغادرة صفحة الاختبار أثناء الحل'):escape(p.name)+'، تم تصحيح إجاباتك وتسجيل نتيجتك في المجموعة.'}</p><div class="result-score">${escape(p.score??0)}<small>/100</small></div><p class="muted">النموذج ${String(p.model).padStart(2,'0')} · الجولة ${escape(current.room.round)}</p><div class="btn-row">${btn('show-board','عرض ترتيب المجموعة')}${btn('home','إنشاء تحدٍ جديد','secondary')}</div>`,'result')}<div class="section">${standings()}${invite()}</div></div>`;}
  function host(){if(!current){return `<div class="boot"><div class="spinner"></div>جارٍ التحقق من بيانات الغرفة</div>`;}
    const r=current.room, players=current.players||[],hp=current.host_players||[];
    const controls=`${r.mode==='live'&&r.status==='waiting'?btn('host-start','بدء البطولة الآن','',busy||!players.length):''}${btn('host-close','إغلاق التسجيل','secondary',busy||r.status==='closed')}${btn('host-reset','فتح جولة جديدة','secondary',busy||players.some(x=>x.status==='in_progress'))}${btn('download','تصدير النتائج CSV','secondary',!hp.length)}${btn('participant','عرض صفحة اللاعبين','text')}`;
    const rows=hp.map(p=>`<tr><td>${escape(p.name)}</td><td>${String(p.model).padStart(2,'0')}</td><td>${p.score===null?'—':escape(p.score)}</td><td>${status(p.status)}</td></tr>`).join('');
    return `<div class="room-page">${roomHeader()}<div class="grid"><div>${card(`<div class="eyebrow">صلاحيات المنظّم</div><h2>إدارة البطولة</h2><p class="muted">${r.mode==='live'?'يمكنك بدء البطولة بعد انضمام جميع المشاركين؛ يبدأ عدّ تنازلي موحّد لمدة 10 ثوانٍ.':'كل مشارك يبدأ الاختبار في الوقت الذي يختاره، وتظهر درجته فور التسليم.'}</p><div class="host-controls">${controls}</div><div class="stats"><div class="stat"><b>${players.length}</b><small>مشارك</small></div><div class="stat"><b>${players.filter(x=>x.status==='finished').length}</b><small>أكمل</small></div><div class="stat"><b>${players.filter(x=>x.status==='cheated').length}</b><small>مستبعد</small></div></div><h3>تفاصيل المشاركين</h3>${hp.length?`<div class="table-wrap"><table><thead><tr><th>الاسم</th><th>النموذج</th><th>الدرجة</th><th>الحالة</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="muted">لا يوجد مشاركون حتى الآن.</p>'}<details class="details"><summary>مفتاح استعادة الغرفة</summary><p class="hint">احتفظ بهذا المفتاح في مكان آمن. لا ترسله مع رابط دعوة المشاركين.</p><input class="input" id="host-secret" type="password" readonly value="${escape(hostToken)}">${btn('copy-host','نسخ مفتاح المنظّم','text sm')}</details>`)}</div><aside>${invite()}${card(`<h3>خطوات البطولة</h3><p class="muted" style="margin-top:10px">1. أنشئ الغرفة وانسخ الرابط.<br>2. انتظر تسجيل المشاركين.<br>3. اضغط بدء البطولة (للوضع المباشر).<br>4. تابع النتائج وصدّر التقرير عند انتهاء الجولة.</p>`)}</aside></div><div class="section">${standings()}</div></div>`;
  }
  function authHost(){return `<div class="room-page">${card(`<div class="eyebrow">دخول المنظّم</div><h2>استعادة إدارة الغرفة</h2><p class="muted">لا يمكن إدارة الغرفة باستخدام رابط المشاركين فقط. أدخل مفتاح المنظّم الذي احتفظت به عند الإنشاء.</p><form id="host-form"><label class="form-label" for="host-input">مفتاح المنظّم</label><input id="host-input" type="password" class="input" value="${escape(hostEntry)}" minlength="64" maxlength="64" required placeholder="رمز الأمان الخاص بالغرفة"/><button class="btn block" type="submit" style="margin-top:18px">الدخول إلى الإدارة</button></form><div style="margin-top:15px">${btn('participant','صفحة المشاركين','secondary sm')}</div>`,'auth')}</div>`;}
  function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
  function statePage(){if(screen==='home')return 'home';if(screen==='host')return 'host';if(!current)return 'loading';const p=current.player;if(p?.status==='in_progress'&&(p.questions||[]).length)return 'quiz';if(p&&['finished','cheated'].includes(p.status))return 'result';return 'lobby';}
  function render(){const prior=document.activeElement;const keepForm=prior?.tagName==='INPUT'&&prior.closest('form')&& screen!=='quiz'; if(keepForm && !busy)return;const target=statePage(); main.innerHTML=target==='home'?home():target==='host'?(hostToken?host():authHost()):target==='quiz'?quiz():target==='result'?result():room(); lastServerStatus=target;updateClock();}
  function updateClock(){const p=current?.player;if(p?.status==='in_progress'&&p.deadline){const seconds=Math.max(0,Math.ceil((Date.parse(p.deadline)-Date.now()-offset)/1000)); const el=document.getElementById('time-left');if(el){el.textContent=formatTime(seconds);if(seconds<120)document.getElementById('timer-box')?.classList.add('warning');}if(seconds===0&&!ended&&!busy){ended=true;void act('finish').finally(()=>ended=false);}}
   const pre=document.getElementById('start-time');if(pre&&current?.room?.starts_at){pre.textContent=Math.max(0,Math.ceil((Date.parse(current.room.starts_at)-Date.now()-offset)/1000));}
  }
  function updateGuard(){const p=current?.player;const should=screen==='room'&&p?.status==='in_progress'&&(p.questions||[]).length>0;
    if(should&&!activeQuiz){activeQuiz=true;write('active:'+roomId,'1');if(typeof BroadcastChannel!=='undefined'){try{channel=new BroadcastChannel('iq-competition:'+roomId);channel.onmessage=event=>{if(event.data?.type==='active'&&event.data?.token===playerToken)detectedExit();};channel.postMessage({type:'active',token:playerToken});}catch{}}}
    if(!should&&activeQuiz){activeQuiz=false;channel?.close();channel=null;}
    if(p&&['finished','cheated'].includes(p.status)){write('active:'+roomId,'');write('left:'+roomId,'');}
  }
  function adopt(result){if(!result?.room)return;const old=statePage();current=result; offset=Date.parse(result.server_now)-Date.now();updateGuard();const next=statePage();if(old==='quiz'&&next==='quiz'){updateClock();return;}render();}
  async function api(action, token, data={}){const sending=Date.now();const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({_action:action,_room:roomId||null,_token:token||null,_data:data}),cache:'no-store'});let result;try{result=await res.json();}catch{throw Error('استجابة غير صالحة من خادم النتائج.');}if(!res.ok){throw Error(result.message||result.error||'تعذر الوصول إلى خادم المسابقة.');}if(result?.server_now){offset=Date.parse(result.server_now)-(sending+Date.now())/2;}return result;}
  async function act(action,data={}){if(busy)return null;busy=true;try{const auth=action.startsWith('host_')?hostToken:playerToken;const result=await api(action,auth,data);if(action==='join'&&result.token){playerToken=result.token;write('player:'+roomId,playerToken);}adopt(result);return result;}catch(err){notify(err.message||'تعذر تنفيذ الطلب');return null;}finally{busy=false;render();}}
  async function create(){if(busy)return;busy=true;try{const title=newRoomName.trim();if(title.length<2||title.length>60)throw Error('يرجى كتابة اسم صحيح للمسابقة');const result=await api('create',null,{title,mode});if(!result.id||!result.token)throw Error('لم تصل بيانات الغرفة من الخادم');roomId=result.id;hostToken=result.token;playerToken='';write('host:'+roomId,hostToken);current=null;createOpen=false;history.pushState({},'',location.pathname+'?room='+roomId+'&host=1');screen='host';await refresh(true);notify('تم إنشاء الغرفة بنجاح. أرسل رابط الدعوة إلى مجموعتك.',true);}catch(err){notify(err.message||'تعذر إنشاء الغرفة');}finally{busy=false;render();}}
  async function refresh(forced=false){if(fetching||(busy&&!forced)||!roomId)return;fetching=true;try{let action,token;if(screen==='host'&&hostToken){action='host';token=hostToken;}else if(screen==='room'&&playerToken){action=read('left:'+roomId)?'cheat':current?.player?.status==='in_progress'?'heartbeat':'player';token=playerToken;}else{action='state';token=null;}
    const result=await api(action,token);lastHeartbeat=Date.now();const old=statePage();adopt(result);if(!forced&&old==='quiz'&&statePage()==='quiz')updateClock();
  }catch(err){if(forced||Date.now()-lastHeartbeat>14000)notify('تعذر تحديث النتائج: '+(err.message||'خطأ غير معروف'));if(/المشاركة غير موجودة|انتهت الجولة/.test(err.message||'')){write('player:'+roomId,'');write('left:'+roomId,'');write('active:'+roomId,'');playerToken='';current=null;}}
    finally{fetching=false;}}
  function detectedExit(){if(!activeQuiz||!playerToken||!roomId)return;activeQuiz=false;write('left:'+roomId,'1');const body=JSON.stringify({_action:'cheat',_room:roomId,_token:playerToken,_data:{}});try{fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body,keepalive:true,cache:'no-store'}).catch(()=>{});}catch{}}
  function route(){const params=new URL(location.href).searchParams;const candidate=params.get('room')||'';const valid=/^[a-f\d]{8}-[a-f\d]{4}-[a-f\d]{4}-[a-f\d]{4}-[a-f\d]{12}$/i.test(candidate);
    if(!valid){screen='home';roomId='';current=null;hostToken='';playerToken='';activeQuiz=false;render();return;}
    if(activeQuiz && candidate!==roomId)detectedExit();
    if(candidate!==roomId){roomId=candidate;current=null;questionIndex=0;finalConfirm=false;}
    playerToken=read('player:'+roomId);hostToken=read('host:'+roomId);const enteringHost=params.has('host');screen=enteringHost?'host':'room';if(!enteringHost&&playerToken&&read('active:'+roomId))write('left:'+roomId,'1');
    render();void refresh(true);
  }
  const go=url=>{if(activeQuiz)detectedExit();history.pushState({},'',url);route();};
  async function copy(value){try{await navigator.clipboard.writeText(value);notify('تم نسخ الرابط إلى الحافظة',true);}catch{notify('تعذر النسخ التلقائي. يمكنك تحديد النص ونسخه يدويًا.');}}
  const shareUrl=()=>location.origin+location.pathname+'?room='+encodeURIComponent(roomId);
  function csv(){const ps=current?.host_players||[];if(!ps.length)return notify('لا توجد نتائج للتصدير');const fields=['name','model','score','status','started_at','finished_at','cheat_events'];const clean=value=>{const s=String(value??'');return '"'+(/^[=+\-@\t\r]/.test(s)?"'":'')+s.replace(/"/g,'""')+'"';};const lines=[fields.join(','),...ps.map(p=>fields.map(f=>clean(p[f])).join(','))].join('\r\n');const blob=new Blob(['\uFEFF'+lines],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`iq-league-${roomId.slice(0,8)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);}
  main.addEventListener('click',async event=>{const control=event.target.closest('[data-action]');if(!control||control.disabled)return;event.preventDefault();const a=control.dataset.action;
    if(a==='create'||a==='open-mode'||a==='live-mode'){createOpen=true;if(a==='open-mode')mode='open';if(a==='live-mode')mode='live';render();return;}
    if(a==='close-modal'){createOpen=false;render();return;}
    if(a==='select-open'||a==='select-live'){mode=a==='select-open'?'open':'live';render();return;}
    if(a==='scroll-modes'){document.getElementById('modes')?.scrollIntoView({behavior:'smooth'});return;}
    if(a==='home'){go(location.pathname);return;}
    if(a==='participant'){go(location.pathname+'?room='+roomId);return;}
    if(a==='copy-link'){await copy(shareUrl());return;}
    if(a==='copy-host'){await copy(hostToken);return;}
    if(a==='whatsapp'){window.open('https://wa.me/?text='+encodeURIComponent('دعوة للمشاركة في تحدي العباقرة: '+shareUrl()),'_blank','noopener,noreferrer');return;}
    if(a==='start'){await act('start');return;}
    if(a==='answer'){const option=Number(control.dataset.index);await act('answer',{index:questionIndex,option});return;}
    if(a==='prev'||a==='next'){questionIndex=Math.max(0,Math.min(9,questionIndex+(a==='next'?1:-1)));render();return;}
    if(a==='jump'){questionIndex=Number(control.dataset.index);render();return;}
    if(a==='confirm-finish'){finalConfirm=true;render();return;}
    if(a==='cancel-finish'){finalConfirm=false;render();return;}
    if(a==='finish'){finalConfirm=false;await act('finish');return;}
    if(a==='show-board'){document.querySelector('.board')?.scrollIntoView({behavior:'smooth'});return;}
    if(a==='host-start'&&confirm('سيبدأ العد التنازلي 10 ثوانٍ لكل المشاركين. بدء البطولة الآن؟')){await act('host_start');return;}
    if(a==='host-close'&&confirm('إغلاق التسجيل للغرفة؟')){await act('host_close');return;}
    if(a==='host-reset'&&confirm('فتح جولة جديدة بنفس رابط الدعوة؟')){await act('host_reset');return;}
    if(a==='download'){csv();return;}
  });
  main.addEventListener('input',ev=>{const t=ev.target;if(t.id==='new-title')newRoomName=t.value;if(t.id==='player-name')joinName=t.value;if(t.id==='host-input')hostEntry=t.value;});
  main.addEventListener('change',ev=>{if(ev.target.id==='agree-rules'){accepted=ev.target.checked;const b=main.querySelector('#join-form button[type=submit]');if(b)b.disabled=!accepted;}});
  main.addEventListener('submit',async ev=>{ev.preventDefault();if(ev.target.id==='create-form')await create();if(ev.target.id==='join-form'){if(!accepted)return notify('يجب قبول قواعد التحدي أولًا.');joinName=main.querySelector('#player-name')?.value.trim()||'';if(joinName.length<2||joinName.length>40)return notify('اختر اسمًا من حرفين إلى أربعين حرفًا.');await act('join',{name:joinName});}if(ev.target.id==='host-form'){hostEntry=main.querySelector('#host-input')?.value.trim()||'';if(hostEntry.length!==64)return notify('مفتاح الإدارة غير صالح.');hostToken=hostEntry;write('host:'+roomId,hostToken);await refresh(true);}});
  document.querySelector('#brand-home').addEventListener('click',ev=>{ev.preventDefault();go(location.pathname);});
  document.querySelector('#nav-home').addEventListener('click',()=>go(location.pathname));
  window.addEventListener('popstate',()=>{if(activeQuiz)detectedExit();route();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')detectedExit();});
  window.addEventListener('pagehide',detectedExit);
  window.addEventListener('blur',()=>{clearTimeout(blurTimer);blurTimer=setTimeout(()=>{if(document.visibilityState==='hidden'||!document.hasFocus())detectedExit();},1200);});
  window.addEventListener('focus',()=>clearTimeout(blurTimer));
  timerId=setInterval(updateClock,400);
  pollTimer=setInterval(()=>{if(roomId&&document.visibilityState==='visible')void refresh();},3800);
  route();
})();

</script>
</body>
