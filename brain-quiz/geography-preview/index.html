t x=\"429.78\" y=\"107.90\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"g-text\">C</text></g><circle cx=\"435.37\" cy=\"263.96\" r=\"4.5\" fill=\"#f4f6ff\"/><g><rect x=\"438.41\" y=\"252.85\" width=\"35\" height=\"38\" rx=\"9\" fill=\"#182841\" fill-opacity=\".96\" stroke=\"#294362\" stroke-width=\"1\"/><text x=\"455.91\" y=\"272.85\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"g-text\">D</text></g><g><rect x=\"86.74\" y=\"115.64\" width=\"62\" height=\"38\" rx=\"9\" fill=\"#182841\" fill-opacity=\".96\" stroke=\"#294362\" stroke-width=\"1\"/><text x=\"117.74\" y=\"135.64\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"g-text\">70°</text></g><g><rect x=\"464.56\" y=\"162.03\" width=\"62\" height=\"38\" rx=\"9\" fill=\"#182841\" fill-opacity=\".96\" stroke=\"#294362\" stroke-width=\"1\"/><text x=\"495.56\" y=\"182.03\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"g-text\">60°</text></g><path d=\"M287.22 180.59 A33 33 0 0 1 291.54 145.40\" class=\"g-gold\"/><g><rect x=\"227.99\" y=\"139.34\" width=\"47\" height=\"38\" rx=\"9\" fill=\"#182841\" fill-opacity=\".96\" stroke=\"#9a763d\" stroke-width=\"1\"/><text x=\"251.49\" y=\"159.34\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"g-unknown\">x</text></g><g><rect x=\"319.50\" y=\"172.39\" width=\"35\" height=\"38\" rx=\"9\" fill=\"#182841\" fill-opacity=\".96\" stroke=\"#294362\" stroke-width=\"1\"/><text x=\"337.00\" y=\"192.39\" text-anchor=\"middle\" dominant-baseline=\"middle\" class=\"g-text\">P</text></g><text x=\"300\" y=\"410\" class=\"g-note\" text-anchor=\"middle\">Arc measures are marked in degrees</text></svg>","options":["115°","65°","130°","5°"],"correct":1},{"id":"m20-q04","category":"استدلال عددي","prompt":"عدد صحيح يترك البواقي 2 و6 و4 عند قسمته، بالترتيب، على 5 و7 و9. أي الأعداد التالية يحقق الشروط الثلاثة معًا؟","options":["517","522","524","526"],"correct":0},{"id":"m20-q05","category":"أنماط متقدمة","prompt":"الحد النوني في هذه المتتابعة يساوي قيمة كثيرة حدود في n من الدرجة الثالثة على الأكثر (حيث يبدأ n من 1). أوجد الحد السادس: 16 ، 34 ، 70 ، 130 ، 220 ، ؟","options":["327","369","337","346"],"correct":3},{"id":"m20-q06","category":"استدلال وترتيب","prompt":"خمسة أشخاص (آدم، باسل، جنى، دينا، إياد) يتنافسون على المراكز من الأول إلى الخامس دون تعادل. المعطيات: باسل يسبق جنى مباشرة. جنى يسبق دينا مباشرة. إياد يسبق آدم مباشرة. آدم يسبق دينا في الترتيب. من يحتل المركز الثالث؟","options":["جنى","دينا","باسل","آدم"],"correct":2},{"id":"m20-q07","category":"توافيق واحتمالات","prompt":"يتكوّن فريق من 9 مهندسين و9 محللين. نريد تشكيل لجنة تضم مهندسين اثنين ومحللين اثنين، ثم اختيار رئيس للجنة من المهندسين المختارين. كم عدد التشكيلات المختلفة مع تحديد الرئيس؟","options":["648","2592","1296","5184"],"correct":1},{"id":"m20-q08","category":"احتمالات شرطية","prompt":"صندوق (أ) فيه 4 كرات حمراء و3 زرقاء، وصندوق (ب) فيه 3 حمراء و7 زرقاء. اخترنا صندوقًا عشوائيًا باحتمال متساوٍ ثم سحبنا منه كرة فكانت حمراء. ما احتمال أن الصندوق المختار كان (أ)؟ (اكتب النسبة في أبسط صورة)","options":["40/61","4/7","3/10","21/61"],"correct":0},{"id":"m20-q09","category":"منطق صوري","prompt":"تحليل حالة منطقية رقم 20: في نظام تصنيف افتراضي: كل عنصر من الفئة (أ) ينتمي إلى (ب)، ولا عنصر من (ب) ينتمي إلى (ج)، وبعض عناصر (د) تنتمي إلى (أ). ما الاستنتاج الذي يلزم قطعًا؟","options":["كل عناصر (د) تنتمي إلى (أ).","بعض عناصر (أ) تنتمي إلى (ج).","لا يوجد عنصر مشترك بين (د) و(ب).","بعض عناصر (د) لا تنتمي إلى (ج)."],"correct":3},{"id":"m20-q10","category":"معدلات العمل","prompt":"آلة (أ) تنجز مشروعًا كاملًا وحدها في 26 ساعات، وآلة (ب) تنجزه وحدها في 65 ساعة. عملتا معًا ثلاث ساعات ثم توقفت (أ). كم دقيقة إضافية تحتاج (ب) لإتمام باقي المشروع وحدها؟","options":["1308 دقيقة","3540 دقيقة","3270 دقيقة","3720 دقيقة"],"correct":2}];
const app=document.querySelector('#app');
const types=['flag_country','country_flag','country_capital','capital_country','country_continent','flag_continent','capital_continent'];
const special=new Set(['ZA','BJ','SZ','PS','YE','ID','MY','LK','NL','BO','NR','SD','CH']);
let state={phase:'setup',subjects:['geo'],count:15,minutes:15,mode:'open',stage:1,questions:[],answers:[],pos:0,deadline:0,finished:false,score:0,history:[]};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=x=>{x=[...x];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
const img=code=>`https://flagcdn.com/w320/${String(code).toLowerCase()}.png`;
function difficulty(c){const seen=new Set(['EG','US','GB','FR','DE','JP','CN','IN','SA','AE','QA','KW','BR','AR','AU','CA','IT','ES','TR','RU','KR','MX','NL','MA','DZ','TN','SD','ZA','NG','TH','PH','IR','NZ']);return seen.has(c.f)?1:c.t.includes('أمريكا')?2:c.t==='أوقيانوسيا'?4:3}
function makeGeo(country,type){if(type.includes('continent')&&!country.simple_continent)return null;if((type==='capital_country'||type==='country_capital'||type==='capital_continent')&&!country.simple_capital)return null;let field,correct,question,flag=null;
switch(type){case 'flag_country':field='c';correct=country.c;question='هذا العلم يخص أي دولة؟';flag=country.f;break;
case 'country_flag':field='f';correct=country.f;question=`اختر العلم الصحيح لدولة ${country.c}.`;break;
case 'country_capital':field='a';correct=country.a;question=`ما عاصمة ${country.c}؟`;break;
case 'capital_country':field='c';correct=country.c;question=`العاصمة ${country.a} تتبع أي دولة؟`;break;
case 'country_continent':field='t';correct=country.t;question=`تقع ${country.c} في أي قارة؟`;break;
case 'flag_continent':field='t';correct=country.t;question='الدولة صاحبة هذا العلم تقع في أي قارة؟';flag=country.f;break;
case 'capital_continent':field='t';correct=country.t;question=`العاصمة ${country.a} تقع في أي قارة؟`;
}
const others=shuffle([...new Set(COUNTRIES.filter(d=>d.f!==country.f&&(field!=='a'||d.simple_capital)&&(field!=='t'||d.simple_continent)).map(d=>d[field]))].filter(x=>x!==correct)).slice(0,3);
if(others.length<3)return null;
const opts=shuffle([correct,...others]);return {id:`${country.f}-${type}`,category:field==='t'?'القارات':field==='f'||flag?'الأعلام':'العواصم والدول',prompt:question,flag_code:flag,options:opts.map(x=>field==='f'?'FLAG:'+x:x),correct:opts.indexOf(correct),difficulty:difficulty(country)};
}
const GEO=COUNTRIES.flatMap(c=>types.map(t=>makeGeo(c,t)).filter(Boolean));
const valid=(q)=>q.options.length===4&&new Set(q.options).size===4&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<4;
if(GEO.length<1100||!GEO.every(valid)||MATH.length!==200||!MATH.every(valid)){alert('خطأ في بنك الأسئلة. تم إيقاف الاختبار حفاظًا على صحة النتائج.');throw Error('Question bank audit failed')}
function start(){let geo=shuffle(GEO),math=shuffle(MATH);let n=state.count;const selected=[];let ng=state.subjects.length===2?Math.ceil(n/2):state.subjects.includes('geo')?n:0;
const stage=state.stage;if(state.mode==='knockout'){geo=geo.filter(q=>stage===1?q.difficulty<=2:stage===2?q.difficulty>=2&&q.difficulty<=3:q.difficulty>=3);}
const used=new Set();for(const q of geo){if(selected.length>=ng)break;const country=q.id.slice(0,2);if(used.has(country))continue;used.add(country);selected.push(q)}
const usedMath=new Set();for(const q of math){if(selected.length>=n)break;if(usedMath.has(q.id))continue;usedMath.add(q.id);selected.push({...q,subject:'math'})}
if(selected.length!==n){alert('لا توجد أسئلة كافية لهذه الإعدادات');return}state.questions=shuffle(selected);state.answers=Array(n).fill(null);state.pos=0;state.deadline=Date.now()+state.minutes*60000;state.phase='quiz';state.finished=false;render()}
function viewSetup(){app.innerHTML=`<section class="hero"><div class="eye">THINK · EXPLORE · COMPETE</div><h1>المنافسة تبدأ <span>من هنا.</span></h1><p>اختر الرياضيات والذكاء أو تحدي الجغرافيا أو الاثنين معًا. اختر عدد الأسئلة والوقت، وتنافس في تجربة احترافية.</p><div class="flags"><img src="${img('EG')}" alt="علم مصر"><img src="${img('JP')}" alt="علم اليابان"><img src="${img('BR')}" alt="علم البرازيل"></div></section><section class="card"><h2>اختار مجالات اللعب</h2><div class="choices"><label class="check"><input type="checkbox" id="geo" ${state.subjects.includes('geo')?'checked':''}><div class="symbol">🌍</div><strong>تحدي الجغرافيا</strong><small>دول، أعلام، عواصم وقارات</small></label><label class="check"><input type="checkbox" id="math" ${state.subjects.includes('math')?'checked':''}><div class="symbol">∑</div><strong>الرياضيات والذكاء</strong><small>هندسة، احتمالات، منطق واستنتاج</small></label><div class="check" style="pointer-events:none"><div class="symbol">✦</div><strong>المختلط</strong><small>علّم على المجالين للخلط التلقائي</small></div></div><div class="grid" style="margin-top:20px"><div class="field"><label>عدد الأسئلة · 10 إلى 25</label><input id="count" type="number" min="10" max="25" value="${state.count}"></div><div class="field"><label>مدة الاختبار بالدقائق · 1 إلى 45</label><input id="minutes" type="number" min="1" max="45" value="${state.minutes}"></div><div class="field"><label>نظام اللعب في المعاينة</label><select id="mode"><option value="open" ${state.mode==='open'?'selected':''}>تحدٍ فردي</option><option value="knockout" ${state.mode==='knockout'?'selected':''}>تحدي مراحل تصاعدية (تجريبي)</option></select></div></div><div class="bar" style="margin-top:22px"><p class="muted">${GEO.length.toLocaleString('ar-EG')} صيغة سؤال جغرافيا متاحة · 188 دولة · أعلام عالية الوضوح</p><button class="button" id="play">ابدأ التحدي ←</button></div></section>`;
app.querySelector('#play').onclick=()=>{state.subjects=['geo','math'].filter(t=>app.querySelector('#'+t).checked);state.count=Number(app.querySelector('#count').value);state.minutes=Number(app.querySelector('#minutes').value);state.mode=app.querySelector('#mode').value;if(!state.subjects.length)return alert('اختر مجالًا واحدًا على الأقل');if(!Number.isInteger(state.count)||state.count<10||state.count>25)return alert('عدد الأسئلة من 10 إلى 25');if(!Number.isInteger(state.minutes)||state.minutes<1||state.minutes>45)return alert('الوقت من دقيقة إلى 45 دقيقة');state.stage=1;start()};}
function finish(){if(state.phase!=='quiz')return;state.score=state.questions.reduce((n,q,i)=>n+(state.answers[i]===q.correct?1:0),0);state.history.push({stage:state.stage,score:state.score,total:state.questions.length});state.phase='result';render()}
function viewQuiz(){const q=state.questions[state.pos],remain=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));if(remain<=0){finish();return}const chosen=state.answers[state.pos];app.innerHTML=`<section class="card"><div class="bar"><div><div class="eye">${state.mode==='knockout'?'STAGE '+state.stage:'IQ LEAGUE · PREMIUM QUIZ'}</div><h2 style="margin:6px 0">${esc(q.category)} · السؤال ${state.pos+1} من ${state.questions.length}</h2></div><div class="clock" id="clock">${String(Math.floor(remain/60)).padStart(2,'0')}:${String(remain%60).padStart(2,'0')}</div></div><progress class="progress" max="${state.questions.length}" value="${state.answers.filter(x=>x!==null).length}"></progress><div class="map">${state.questions.map((_,i)=>`<button data-jump="${i}" class="bubble ${i===state.pos?'active':''} ${state.answers[i]!==null?'answered':''}">${i+1}</button>`).join('')}</div><div class="card" style="margin:23px 0;background:#1a2b41"><div class="eye">السؤال ${state.pos+1}</div><h2 class="question">${esc(q.prompt)}</h2>${q.flag_code?`<figure class="question-flag"><img src="${img(q.flag_code)}" alt="علم الدولة المطلوب"><small>اختار الإجابة الصحيحة</small></figure>`:''}${q.svg?`<div class="diagram">${q.svg}</div>`:''}<div class="answer-grid">${q.options.map((o,i)=>`<button class="answer ${chosen===i?'selected':''}" data-answer="${i}">${String(o).startsWith('FLAG:')?`<img src="${img(String(o).slice(5))}" alt="علم الاختيار ${i+1}">`:`<b>${i+1}.</b> ${esc(o)}`}</button>`).join('')}</div><div class="bar"><button class="button secondary" id="prev" ${state.pos===0?'disabled':''}>السابق</button><button class="button" id="next">${state.pos===state.questions.length-1?'تسليم الإجابات':'التالي ←'}</button></div></div><p class="muted">يتم احتساب الدرجة فقط عند التسليم. لا تظهر الإجابة الصحيحة أثناء الاختبار.</p></section>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.answers[state.pos]=Number(b.dataset.answer);render()});app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{state.pos=Number(b.dataset.jump);render()});app.querySelector('#prev').onclick=()=>{state.pos--;render()};app.querySelector('#next').onclick=()=>{if(state.pos===state.questions.length-1){if(confirm('تسليم الإجابات وإنهاء التحدي؟'))finish()}else{state.pos++;render()}}}
function viewResult(){const total=state.questions.length,percent=Math.round(state.score/total*100),passed=percent>=50;app.innerHTML=`<section class="hero"><div class="eye">FINAL RESULT · IQ LEAGUE</div><h1>${state.mode==='knockout'?(passed?'أحسنت! <span>تأهلت للمرحلة التالية.</span>':'رحلتك انتهت <span>في هذه المرحلة.</span>'):'انتهى التحدي <span>وحان وقت النتائج.</span>'}</h1><p>المرحلة ${state.stage} · ${state.subjects.length===2?'رياضيات وجغرافيا':state.subjects[0]==='geo'?'تحدي الجغرافيا':'الرياضيات والذكاء'}</p></section><section class="card"><div class="stat-row"><div class="stat"><strong>${percent}%</strong><small>نسبة الدرجة</small></div><div class="stat"><strong>${state.score}/${total}</strong><small>إجابات صحيحة</small></div><div class="stat"><strong>${total-state.score}</strong><small>إجابات خاطئة أو فارغة</small></div></div><div class="feedback" style="margin:22px 0">${state.mode==='knockout'?passed?'تجاوزت 50%، ويحق لك تجربة المرحلة الأصعب.':'أقل من 50%، فتوقفت رحلتك. حاول مرة أخرى.':'يمكنك إعادة المحاولة بأسئلة مختلفة وتطوير نتيجتك.'}</div><div class="bar"><button class="button secondary" id="restart">إعدادات جديدة</button>${state.mode==='knockout'&&passed&&state.stage<4?`<button class="button" id="advance">المرحلة ${state.stage+1} ←</button>`:'<button class="button" id="again">العب مرة ثانية ←</button>'}</div></section>`;app.querySelector('#restart').onclick=()=>{state.phase='setup';state.stage=1;render()};let adv=app.querySelector('#advance');if(adv)adv.onclick=()=>{state.stage++;start()};let again=app.querySelector('#again');if(again)again.onclick=()=>{state.stage=1;start()}}
function render(){if(state.phase==='setup')viewSetup();else if(state.phase==='quiz')viewQuiz();else viewResult()};setInterval(()=>{if(state.phase!=='quiz')return;const sec=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));const node=document.querySelector('#clock');if(node)node.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(sec<=0)finish()},350);render();
</script></body></html>
